[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.headers]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:; frame-src 'self' https:;"

[[redirects]]
  from = "/api/webdav/test-connection"
  to = "https://rebun.infini-cloud.net/dav/test-connection"
  status = 200
  force = true

[[redirects]]
  from = "/api/webdav/*"
  to = "https://rebun.infini-cloud.net/dav/:splat"
  status = 200
  force = true
  [redirects.headers]
    X-Forwarded-Host = ":host"
    X-Forwarded-Proto = "https"
